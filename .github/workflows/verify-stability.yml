name: Verify Stability

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  basic:
    strategy:
      fail-fast: false
      matrix:
        case:
          - common-libs
          - esbuild-three
          - rome
          - atlaskit-editor
        scenario:
          - development-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: "yarn"
      - uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 5
          command: yarn
      - uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 25
          command: node bin/compare.js ${{ matrix.case }} ${{ matrix.scenario }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compare-results-${{ matrix.case }}-${{ matrix.scenario }}
          path: output

  complete:
    needs: [basic]
    strategy:
      fail-fast: false
      matrix:
        case:
          - common-libs
          - esbuild-three
          - rome
          - atlaskit-editor
        scenario:
          - development-build
          - development-build+persistent-cache
          - development-build+swc-env
          - development-build+babel-env
          - development-rebuild
          - production-build
          - production-build+source-map
          - production-build+no-minimize
          - production-build+persistent-cache
          - production-build+initial-persistent-cache
          - production-build+source-map+persistent-cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: "yarn"
      - uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 5
          command: yarn
      - uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 25
          command: node bin/compare.js ${{ matrix.case }} ${{ matrix.scenario }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compare-results-${{ matrix.case }}-${{ matrix.scenario }}
          path: output
          overwrite: true

  report:
    needs: [basic, complete]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: "yarn"
      - uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 5
          command: yarn
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: output
          pattern: compare-results-*
          merge-multiple: true
      - run: node bin/report.js
